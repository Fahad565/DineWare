services:
  - type: web
    name: dineware-backend-engine
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/backend.Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_ENV
        value: sandbox
      - key: AT_SENDER_ID
        sync: false
      - key: AT_USSD_CODE
        value: "*384*44#"
      - key: PUBLIC_PORTAL_URL
        value: https://dineware-operator-portal.onrender.com

  - type: web
    name: dineware-operator-portal
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/frontend.Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: dineware-backend-engine
          property: host
